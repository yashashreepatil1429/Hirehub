{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-md-9">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Register</h3>
        <form method="post">
          <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Name</label><input type="text" class="form-control" name="name" required></div>
            <div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone" required></div>
            <div class="col-md-6 mb-3"><label class="form-label">Role</label>
              <select class="form-select" name="role">
                <option value="CANDIDATE">Candidate</option>
                <option value="RECRUITER">Recruiter</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
            <div class="col-md-6 mb-3"><label class="form-label">Confirm Password</label><input type="password" class="form-control" name="confirm_password" required></div>
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
