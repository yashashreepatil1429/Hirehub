{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4">
  <h2>Company profile</h2>
  <form method="post" action="{{ url_for('recruiter.company') }}">
    <div class="mb-3"><label class="form-label">Company name</label><input class="form-control" name="name" value="{{ company.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ company.get('location', '') }}"></div>
    <div class="mb-3"><label class="form-label">Website</label><input class="form-control" type="url" name="website" value="{{ company.get('website', '') }}"></div>
    <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="4" name="description">{{ company.get('description', '') }}</textarea></div>
    <button class="btn btn-primary">Save company profile</button>
  </form>
</div></div></div>
{% endblock %}
